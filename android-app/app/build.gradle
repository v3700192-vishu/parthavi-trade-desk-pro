plugins {
    id "com.android.application"
}

android {
    namespace "com.parthavi.tradedesk"
    compileSdk 35

    defaultConfig {
        applicationId "com.parthavi.tradedesk"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.16.0"
}
