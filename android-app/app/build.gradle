plugins {
    id "com.android.application"
}

android {
    namespace "com.parthavi.tradedesk"
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName "1.5.4"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "deployment"
    productFlavors {
        pc {
            dimension "deployment"
            applicationId "com.parthavi.tradedesk"
            buildConfigField "String", "START_URL", '"https://kirankhoradiya.taile3cd6d.ts.net/?source=android_app&mobile=full"'
            buildConfigField "String", "UPDATE_JSON_URL", '"https://parthavi-trade-desk-pro.onrender.com/app-update.json"'
            manifestPlaceholders = [appName: "PARTHAVI TRADE DESK PRO PC"]
        }
        render {
            dimension "deployment"
            applicationId "com.parthavi.tradedesk.render"
            buildConfigField "String", "START_URL", '"https://parthavi-trade-desk-pro.onrender.com/?source=android_app&mobile=full"'
            buildConfigField "String", "UPDATE_JSON_URL", '"https://parthavi-trade-desk-pro.onrender.com/app-update-render.json"'
            manifestPlaceholders = [appName: "PARTHAVI TRADE DESK PRO Render"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.16.0"
}
