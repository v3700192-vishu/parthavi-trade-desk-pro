name: Build PARTHAVI TRADE DESK PRO Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parthavi-trade-desk-pro-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.5.1-build-${{ github.run_number }}
          name: PARTHAVI TRADE DESK PRO Android v1.5.1 (${{ github.run_number }})
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish in-app update manifest
        env:
          APP_VERSION_CODE: "7"
          APP_VERSION_NAME: "1.5.1"
          RELEASE_TAG: android-v1.5.1-build-${{ github.run_number }}
        shell: bash
        run: |
          cat > public/app-update.json <<EOF
          {
            "versionCode": ${APP_VERSION_CODE},
            "versionName": "${APP_VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "notes": "Perfect full-width phone layout, one-column vertical scrolling, full-width Angel-style chart, no page horizontal drag, and native alerts/haptics."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git diff --cached --quiet || git commit -m "chore: publish Android update manifest ${APP_VERSION_NAME}"
          git push
