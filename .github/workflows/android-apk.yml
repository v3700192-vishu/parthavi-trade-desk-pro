name: Build PARTHAVI TRADE DESK PRO Android Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build PC and Render APKs
        working-directory: android-app
        run: |
          gradle --no-daemon --console=plain assemblePcDebug assembleRenderDebug
          cp app/build/outputs/apk/pc/debug/app-pc-debug.apk app/build/outputs/apk/pc/debug/app-debug.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parthavi-trade-desk-pro-android-apks
          path: |
            android-app/app/build/outputs/apk/pc/debug/app-pc-debug.apk
            android-app/app/build/outputs/apk/pc/debug/app-debug.apk
            android-app/app/build/outputs/apk/render/debug/app-render-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.5.4-build-${{ github.run_number }}
          name: PARTHAVI TRADE DESK PRO Android v1.5.4 (${{ github.run_number }})
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/pc/debug/app-pc-debug.apk
            android-app/app/build/outputs/apk/pc/debug/app-debug.apk
            android-app/app/build/outputs/apk/render/debug/app-render-debug.apk

      - name: Publish in-app update manifests
        env:
          APP_VERSION_CODE: "10"
          APP_VERSION_NAME: "1.5.4"
          RELEASE_TAG: android-v1.5.4-build-${{ github.run_number }}
        shell: bash
        run: |
          mkdir -p public
          cat > public/app-update.json <<EOF
          {
            "versionCode": ${APP_VERSION_CODE},
            "versionName": "${APP_VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "notes": "PC edition. Opens the private server PC over Tailscale HTTPS. Tailscale must be connected and the server PC online. Trading logic and NO TRADE safety gates are unchanged."
          }
          EOF
          cat > public/app-update-render.json <<EOF
          {
            "versionCode": ${APP_VERSION_CODE},
            "versionName": "${APP_VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-render-debug.apk",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "notes": "Render edition. Opens the hosted Render web app. The PC edition remains a separate install."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json public/app-update-render.json
          git diff --cached --quiet || git commit -m "chore: publish Android PC and Render update manifests ${APP_VERSION_NAME}"
          git push
