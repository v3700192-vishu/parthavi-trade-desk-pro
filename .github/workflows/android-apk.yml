name: Build PARTHAVI TRADE DESK PRO Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Read app version
        id: version
        working-directory: android-app
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parthavi-trade-desk-pro-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}
          name: PARTHAVI TRADE DESK PRO Android v${{ steps.version.outputs.version_name }} (${{ github.run_number }})
          generate_release_notes: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Sync in-app update manifest
        shell: bash
        run: |
          cat > public/app-update.json <<EOF
{
  "versionCode": ${{ steps.version.outputs.version_code }},
  "versionName": "${{ steps.version.outputs.version_name }}",
  "apkUrl": "https://github.com/v3700192-vishu/parthavi-trade-desk-pro/releases/latest/download/app-debug.apk",
  "notes": "PARTHAVI TRADE DESK PRO Android update • mobile haptics, PB launcher and latest app fixes."
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Android app manifest to v${{ steps.version.outputs.version_name }}"
          git push
