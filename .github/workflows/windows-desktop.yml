name: Windows Desktop App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run safety-gate regression tests
        run: node --test

      - name: Build Windows installer and portable EXE
        run: npm run desktop:build -- --publish never

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: PARTHAVI-Trade-Desk-Pro-Windows
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 30
